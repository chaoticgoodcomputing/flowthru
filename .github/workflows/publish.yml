name: Publish

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # mint the GitHub OIDC token for NuGet Trusted Publishing

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
          DOTNET_NOLOGO: "true"
          DOTNET_CLI_TELEMETRY_OPTOUT: "true"

      - name: Download NuGet packages from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/packages
          gh release download "${{ github.ref_name }}" \
            --pattern "*.nupkg" \
            --dir dist/packages \
            --repo "${{ github.repository }}"

      # NuGet Trusted Publishing: exchange the job's OIDC token for a short-lived
      # API key. Requires a trusted-publishing policy on nuget.org for
      # owner=<org>, repo=flowthru, workflow file=publish.yml.
      - name: Authenticate to NuGet (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push "dist/packages/*.nupkg" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
