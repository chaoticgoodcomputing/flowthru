name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/instructions/**"
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore(release)')"

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
          DOTNET_NOLOGO: "true"
          DOTNET_CLI_TELEMETRY_OPTOUT: "true"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup UV
        uses: astral-sh/setup-uv@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Node dependencies
        run: pnpm install

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Compute affected projects
        id: affected
        run: |
          NX_BASE=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "nx-base=${NX_BASE}" >> "$GITHUB_OUTPUT"
          AFFECTED=$(pnpm nx show projects --affected --base="${NX_BASE}" --json 2>/dev/null \
            | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).join(' '))")
          echo "NX_AFFECTED_PROJECTS=${AFFECTED}" >> "$GITHUB_ENV"
          # Write JSON for debugging artifact
          pnpm nx show projects --affected --base="${NX_BASE}" --json 2>/dev/null > dist/nx-affected.json || true
          # Print to step summary for visibility
          {
            echo "## Affected Projects (base: \`${NX_BASE}\`)"
            echo '```'
            echo "${AFFECTED}" | tr ' ' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        env:
          CI: "true"
        run: |
          pnpm nx affected -t test \
            --base="${{ steps.affected.outputs.nx-base }}" --head=HEAD \
            --output-style=stream \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --logger "console;verbosity=minimal"

      - name: Generate coverage badges
        continue-on-error: true
        env:
          REPORTGENERATOR_LICENSE: ${{ secrets.REPORTGENERATOR_LICENSE }}
        run: |
          COVERAGE_FILES=$(find tests -name "coverage.cobertura.xml" 2>/dev/null | head -1)
          if [ -n "$COVERAGE_FILES" ]; then
            reportgenerator \
              "-reports:tests/**/TestResults/**/coverage.cobertura.xml" \
              "-targetdir:coverage-badges" \
              "-reporttypes:Badges" \
              "-verbosity:Warning"
          else
            echo "No coverage files found — skipping badge generation."
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run NX Release (version + changelog + commit + tag)
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: "true"
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          node scripts/release.mjs
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version bumped from $OLD_VERSION to $NEW_VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version bump — skipping release."
          fi

      - name: Push release commit and tag
        if: steps.release.outputs.changed == 'true'
        run: git push --follow-tags

      - name: Create draft GitHub Release
        if: steps.release.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.release.outputs.version }}"
          # Extract the changelog entry for this version
          NOTES=$(awk "/^## ${{ steps.release.outputs.version }}/{found=1;next} /^## /{if(found)exit} found{print}" CHANGELOG.md)
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes "${NOTES}" \
            --draft

      - name: Install Copilot CLI
        if: steps.release.outputs.changed == 'true'
        run: npm install -g @github/copilot

      - name: Determine last published release tag
        if: steps.release.outputs.changed == 'true'
        id: last-published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the most recent non-draft, non-prerelease published release tag
          BASE_TAG=$(gh release list --limit 20 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false)] | .[0].tagName // empty')
          if [ -z "$BASE_TAG" ]; then
            # Fallback: second-latest git tag if no published release exists
            BASE_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          fi
          echo "tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Base tag for release summary: ${BASE_TAG}"

      - name: Generate release summary
        if: steps.release.outputs.changed == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: |
          HEAD_TAG="v${{ steps.release.outputs.version }}"
          BASE_TAG="${{ steps.last-published.outputs.tag }}"
          copilot -p "Generate a release summary. Base tag: ${BASE_TAG}, head tag: ${HEAD_TAG}. Summarize all changes between these two tags." \
            --agent=dev-relations \
            --model=claude-haiku-4.5 \
            --available-tools='view,create,edit,bash' \
            --allow-tool='shell(git:*)' \
            --allow-tool='write' \
            --allow-tool='view' \
            --add-dir=. \
            --deny-tool='shell(git push)' \
            --deny-tool='shell(git reset)' \
            --deny-tool='shell(git checkout)' \
            --deny-tool='shell(git commit)' \
            --deny-tool='shell(git merge)' \
            --deny-tool='shell(git rebase)' \
            --deny-tool='shell(git branch -d)' \
            --deny-tool='shell(git tag -d)' \
            --no-ask-user

      - name: Prepend summary to draft release
        if: steps.release.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.release.outputs.version }}"
          SUMMARY_FILE="docs/scratch/release-${{ steps.release.outputs.version }}.md"
          if [ -f "$SUMMARY_FILE" ]; then
            EXISTING_NOTES=$(gh release view "${VERSION}" --json body -q '.body')
            {
              cat "$SUMMARY_FILE"
              echo ""
              echo "---"
              echo ""
              echo "$EXISTING_NOTES"
            } > /tmp/combined-notes.md
            gh release edit "${VERSION}" --notes-file /tmp/combined-notes.md
          fi

      - name: Publish prerelease to NuGet
        if: steps.release.outputs.changed == 'true'
        env:
          FLOWTHRU_NUGET_API_KEY: ${{ secrets.FLOWTHRU_NUGET_API_KEY }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          PRERELEASE_VERSION="${VERSION}-preview.${{ github.run_number }}"
          # Override version in Directory.Build.props for the prerelease pack only.
          # This file was already committed and pushed — this mutation is ephemeral.
          sed -i "s|<Version>.*</Version>|<Version>${PRERELEASE_VERSION}</Version>|" Directory.Build.props
          pnpm nx run-many -t pack
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" Directory.Build.props
          dotnet nuget push "dist/packages/*.nupkg" \
            --api-key "${FLOWTHRU_NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload coverage badges as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badges
          path: coverage-badges/
          retention-days: 7
