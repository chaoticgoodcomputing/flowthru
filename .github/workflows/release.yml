name: CI and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/instructions/**"
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, 'chore:') && !contains(github.event.head_commit.message, 'chore(')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
          DOTNET_NOLOGO: "true"
          DOTNET_CLI_TELEMETRY_OPTOUT: "true"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true

      - name: Install dependencies
        run: pnpm install

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Run tests and generate coverage badges
        env:
          REPORTGENERATOR_LICENSE: ${{ secrets.REPORTGENERATOR_LICENSE }}
          CI: "true"
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: pnpm nx run flowthru:coverage:badges

      - name: Upload coverage badges
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badges
          path: coverage-badges/
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write # Required to push commits and tags
      packages: write # Required for NuGet publish
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, 'chore:') && !contains(github.event.head_commit.message, 'chore(')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Install dependencies
        run: pnpm install

      - name: Download coverage badges
        uses: actions/download-artifact@v4
        with:
          name: coverage-badges
          path: coverage-badges/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
          DOTNET_NOLOGO: "true"
          DOTNET_CLI_TELEMETRY_OPTOUT: "true"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and generate changelog
        id: version
        run: |
          # Run commit-and-tag-version via NX
          pnpm nx run flowthru:release

          # Extract new version from package.json
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

          echo "New version: $NEW_VERSION"

      - name: Check if version changed
        id: version_check
        run: |
          if git diff --quiet HEAD package.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No version changes detected - skipping release"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed to ${{ steps.version.outputs.version }}"
          fi

      - name: Commit version bump and changelog
        if: steps.version_check.outputs.changed == 'true'
        run: |
          git add .
          git commit -m "chore(release): ${{ steps.version.outputs.version }} [skip ci]"
          git tag v${{ steps.version.outputs.version }}
          git push --follow-tags

      - name: Build and pack NuGet package
        if: steps.version_check.outputs.changed == 'true'
        run: pnpm nx run flowthru:publish

      - name: Prepare coverage badges for release
        if: steps.version_check.outputs.changed == 'true'
        run: |
          # Copy badges for the release (both generic and versioned)
          cp coverage-badges/badge_linecoverage.svg coverage-badge.svg
          cp coverage-badges/badge_linecoverage.svg coverage-badge-${{ steps.version.outputs.version }}.svg

      - name: Extract changelog for release
        if: steps.version_check.outputs.changed == 'true'
        id: changelog
        run: |
          # Extract the latest release notes from CHANGELOG.md
          # This gets everything between the first two ## headers
          CHANGELOG=$(awk '/^## \[?[0-9]/{if(++n==2)exit;if(n==1)next}n==1' CHANGELOG.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.version_check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: |
            dist/packages/*.nupkg
            dist/packages/*.snupkg
            coverage-badge.svg
            coverage-badge-${{ steps.version.outputs.version }}.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NuGet
        if: steps.version_check.outputs.changed == 'true'
        run: |
          dotnet nuget push "dist/packages/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
