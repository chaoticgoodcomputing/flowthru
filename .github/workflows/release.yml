name: CI and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/instructions/**"
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore(release)')"

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
          DOTNET_NOLOGO: "true"
          DOTNET_CLI_TELEMETRY_OPTOUT: "true"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup UV
        uses: astral-sh/setup-uv@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Node dependencies
        run: pnpm install

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Run tests and generate coverage badges
        env:
          REPORTGENERATOR_LICENSE: ${{ secrets.REPORTGENERATOR_LICENSE }}
          CI: "true"
        run: |
          pnpm nx run-many -t test --projects=tag:type:test --output-style=stream \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --logger "console;verbosity=minimal"
          reportgenerator \
            "-reports:tests/**/TestResults/**/coverage.cobertura.xml" \
            "-targetdir:coverage-badges" \
            "-reporttypes:Badges" \
            "-verbosity:Warning"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run NX Release (version + changelog + GitHub Release)
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: "true"
        run: |
          node scripts/release.mjs
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          if git diff --quiet HEAD package.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No version bump — skipping publish."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version bumped to $NEW_VERSION"
          fi

      - name: Build release and pack NuGet packages
        if: steps.release.outputs.changed == 'true'
        run: pnpm nx run flowthru:pack

      - name: Publish to NuGet
        if: steps.release.outputs.changed == 'true'
        run: |
          dotnet nuget push "dist/packages/*.nupkg" \
            --api-key ${{ secrets.FLOWTHRU_NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push release commit and tag
        if: steps.release.outputs.changed == 'true'
        run: git push --follow-tags

      - name: Create GitHub Release
        if: steps.release.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.release.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## ${NEW_VERSION}/{found=1;next} /^## /{if(found)exit} found{print}" CHANGELOG.md)
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes "${NOTES}"

      - name: Upload coverage badges as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badges
          path: coverage-badges/
          retention-days: 7
