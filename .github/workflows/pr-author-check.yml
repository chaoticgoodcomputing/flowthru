name: PR Author Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-authors:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Validate commit authors
        uses: actions/github-script@v7
        with:
          script: |
            // Co-authors matching an allowlist entry are always permitted.
            const allowedBots = [
              'github-actions[bot]',
              'dependabot[bot]'
            ];

            // Glob patterns matched against "Name <email>".
            // *  → any characters
            // Entries are checked AFTER the allowlist, so allowed bots
            // won't be caught by a broad pattern like *[bot]*.
            const blockedPatterns = [
              '*[bot]*',
              '*@anthropic.com',
              '*@openai.com',
              '*@google.com',
            ];

            // Convert a glob pattern to a RegExp.
            // Only supports '*' (wildcard) — brackets are literal.
            function globToRegex(pattern) {
              const escaped = pattern.replace(/([.+?^${}()|\\])/g, '\\$1')
                                     .replace(/\[/g, '\\[')
                                     .replace(/\]/g, '\\]')
                                     .replace(/\*/g, '.*');
              return new RegExp(`^${escaped}$`, 'i');
            }

            const blockedRegexes = blockedPatterns.map(globToRegex);

            // Fetch all commits in the PR
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const violations = [];

            for (const commit of commits) {
              const message = commit.commit.message;
              const sha = commit.sha.substring(0, 7);

              // Extract Co-authored-by lines
              const coAuthorRegex = /^Co-authored-by:\s*(.+?)\s*<(.+?)>/gim;
              let match;

              while ((match = coAuthorRegex.exec(message)) !== null) {
                const name = match[1].trim();
                const email = match[2].trim();
                const identity = `${name} <${email}>`;

                // Skip explicitly allowed bots
                if (allowedBots.includes(name)) continue;

                // Reject if identity matches any blocked pattern
                if (blockedRegexes.some(re => re.test(identity))) {
                  violations.push({ sha, name, email });
                }
              }
            }

            if (violations.length > 0) {
              const errorReport = violations.map(v =>
                `  - Commit ${v.sha}: ${v.name} <${v.email}>`
              ).join('\n');

              core.setFailed(
                `❌ Blocked co-authors detected:\n\n${errorReport}\n\n` +
                `Co-authors matching the following patterns are not permitted:\n` +
                `  - ${blockedPatterns.join('\n  - ')}\n\n` +
                `Please remove blocked co-authors from your commits using:\n` +
                `  git rebase -i HEAD~<n>  # Edit commits\n` +
                `  git commit --amend      # Modify commit message\n` +
                `  git push --force        # Update PR`
              );
            } else {
              console.log('✅ All commit authors validated successfully');
            }
