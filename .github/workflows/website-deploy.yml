name: Deploy website to GitHub Pages

on:
  # Mirrors the NuGet publish trigger — the deployed docs always correspond
  # to the most recently released version of Flowthru. The release event
  # checks out the release tag, so docfx-generated reference reflects the
  # released code, not whatever happens to be on main at deploy time.
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CI environment
        uses: ./.github/actions/setup

      - name: Build website
        env:
          CI: "true"
        run: pnpm nx run site:build --output-style=stream

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
