name: Setup Flowthru CI Environment
description: >
  Installs all non-Node toolchains (.NET, Node, Python, uv, pnpm, Java)
  and runs pnpm install (which also runs dotnet restore via the postinstall hook).
  NOTE: the Apache Spark install is temporarily commented out (see block below).
  Spark-backed tests report Inconclusive — not fail — when SPARK_HOME is absent,
  so CI stays green without it.

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"
        dotnet-quality: "preview"
      env:
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
        DOTNET_NOLOGO: "true"
        DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Setup UV
      uses: astral-sh/setup-uv@v5

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.6.3

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    # ─────────────────────────────────────────────────────────────────────────
    # Apache Spark install — TEMPORARILY DISABLED (commented, not removed).
    #
    # Why disabled: the pinned version 4.1.1 was rotated off the dlcdn.apache.org
    # mirror once 4.1.2 superseded it, so the download began returning a 404 HTML
    # page (→ "gzip: stdin: not in gzip format") on any cache miss. CI had been
    # surviving on the cached /opt/spark until that cache was evicted (~7-day
    # no-access lifetime), at which point every run failed in setup.
    #
    # Safe to disable: Spark-backed tests (Flowthru.Extensions.Spark.Tests) gate
    # on the SPARK_HOME TestCapability and report Inconclusive — not fail — when
    # it is unset (see tests/extensions/CONTRIBUTING.md). With these steps off,
    # SPARK_HOME is never exported, so those tests are skipped rather than red.
    #
    # When restoring (Spark compat work): bump to a current version, prefer the
    # permanent archive (https://archive.apache.org/dist/spark/...) over dlcdn so
    # a future rotation can't break it, add `curl --fail` so a 404 fails fast
    # with a clear message instead of a cryptic tar error, and bump the cache key
    # to match the new version.
