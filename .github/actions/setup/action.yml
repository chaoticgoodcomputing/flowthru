name: Setup Flowthru CI Environment
description: >
  Installs all non-Node toolchains (.NET, Node, Python, uv, pnpm, Java, Spark)
  and runs pnpm install (which also runs dotnet restore via the postinstall hook).

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"
        dotnet-quality: "preview"
      env:
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
        DOTNET_NOLOGO: "true"
        DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Setup UV
      uses: astral-sh/setup-uv@v5

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.6.3

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: Restore Apache Spark 4.1.1 from cache
      id: spark-cache
      uses: actions/cache@v4
      with:
        path: /opt/spark
        key: spark-4.1.1-hadoop3

    - name: Download Apache Spark 4.1.1
      if: steps.spark-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        SPARK_VERSION=4.1.1
        HADOOP_VERSION=3
        INSTALL_DIR=/opt/spark
        TARBALL="spark-${SPARK_VERSION}-bin-hadoop${HADOOP_VERSION}.tgz"
        URL="https://archive.apache.org/dist/spark/spark-${SPARK_VERSION}/${TARBALL}"

        echo "Downloading Spark ${SPARK_VERSION} from ${URL}"
        curl --retry 3 --retry-delay 10 --retry-connrefused \
          --progress-bar \
          -L -o "/tmp/${TARBALL}" \
          "${URL}"

        echo "Download complete. Extracting..."
        tar -xz -C /tmp -f "/tmp/${TARBALL}"
        sudo mv "/tmp/spark-${SPARK_VERSION}-bin-hadoop${HADOOP_VERSION}" "${INSTALL_DIR}"
        echo "Spark installed to ${INSTALL_DIR}"

    - name: Configure Apache Spark environment
      shell: bash
      run: |
        echo "SPARK_HOME=/opt/spark" >> $GITHUB_ENV
        echo "/opt/spark/bin" >> $GITHUB_PATH

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install Node dependencies
      shell: bash
      run: pnpm install
